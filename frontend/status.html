<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Placement Status | SPMS</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">🎓 SPMS</div>

    <nav>

        <a href="index.html">Home</a>

        <a href="dashboard.html">Dashboard</a>

        <a href="jobs.html">Jobs</a>

        <a href="applications.html">My Applications</a>

        <a href="login.html">Logout</a>

    </nav>

</header>


<section class="jobs-section">

    <div class="jobs-header">

        <h1>Placement Status</h1>

        <p>
            Track your placement application status.
        </p>

    </div>


    <div class="jobs-container" id="statusContainer">

    </div>

</section>


<footer class="footer">

    <p>
        © 2026 Student Placement Management System |
        College Semester Project
    </p>

</footer>


<script>

    const applications =
        JSON.parse(localStorage.getItem("applications")) || [];

    const container =
        document.getElementById("statusContainer");


    if (applications.length === 0) {

        container.innerHTML =
            "<p>No placement applications found.</p>";

    } else {

        applications.forEach(function(application) {

            container.innerHTML += `

                <div class="job-card">

                    <div class="company-logo">
                        ✓
                    </div>

                    <div class="job-info">

                        <h2>
                            ${application.jobName}
                        </h2>

                        <p>
                            Placement Application
                        </p>

                        <span class="job-status">
                            ${application.status}
                        </span>

                    </div>

                </div>

            `;

        });

    }

</script>

</body>

</html>
